      minSteps: 2
      stalenessWarning: true
      mustCiteSourceIds: [portabilidad-telefonia]
    mockAnswer: |-
      {"question": "La portabilidad de mi número se ha retrasado, ¿dónde reclamo si el operador no responde?", "outOfScope": false, "blocks": [{"kind": "step", "n": 1, "claim": "La reclamación va primero al operador.", "citations": [{"sourceId": "portabilidad-telefonia"}]}, {"kind": "step", "n": 2, "claim": "Si no contesta en un mes o la respuesta no te satisface, presenta la reclamación ante la Oficina de Atención al Usuario de Telecomunicaciones.", "citations": [{"sourceId": "portabilidad-telefonia"}]}, {"kind": "warning", "claim": "Esta información puede estar desactualizada: la ficha de origen no tiene fecha de verificación.", "citations": [{"sourceId": "portabilidad-telefonia"}]}]}

