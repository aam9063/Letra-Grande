# Casos del conjunto de evaluaciones del asistente (AI-04, sección 13.2 de docs/ARRANQUE.md).
# Dato versionado, separado del código que los ejecuta: cuatro casos por cada una
# de las diez categorías. Las preguntas usan datos personales ficticios (marcadores
# del enmascarado) y cada caso apunta a una ficha real de content/.
#
# Campos:
#   id, category, question: identificación del caso.
#   expectedFicha: id de la ficha de content/ que debe responder, o null si se espera rechazo.
#   expect: qué se espera (todas las claves son opcionales):
#     outOfScope: la respuesta honesta es outOfScope true y sin bloques.
#     blocksWithCitations: respuesta con bloques y todas las citas válidas.
#     figuresBacked: ninguna cifra fuera del texto de las fuentes citadas.
#     minSteps: mínimo de bloques "step" (ruta de escalado).
#     clarification: una pregunta corta de aclaración (o outOfScope si no hay contenido que citar).
#     stalenessWarning: la respuesta lleva un bloque "warning" de desactualización.
#     mustCiteSourceIds: al menos una de estas fuentes citada.
#     mustNotMention: fragmentos que no pueden aparecer (nombres ficticios prohibidos).
#   mockAnswer: respuesta del catálogo cerrado que devuelve el proveedor mock para esta
#     pregunta. Con el proveedor real (nan) no se usa. Sus afirmaciones están respaldadas
#     por la ficha esperada y no contienen datos personales reales.
cases:
  # Ruta de escalado: pasos del escalado de la ficha, con fuentes.
  - id: escalado-01
    category: escalado
    question: "Mi comercializadora de luz no contesta a mi reclamación, ¿a quién acudo ahora?"
    expectedFicha: reclamar-suministro-electrico
    expect:
      blocksWithCitations: true
      figuresBacked: true
      minSteps: 3
      stalenessWarning: true
      mustCiteSourceIds: [cnmc-energia]
    mockAnswer: |-
      {"question": "Mi comercializadora de luz no contesta a mi reclamación, ¿a quién acudo ahora?", "outOfScope": false, "blocks": [{"kind": "step", "n": 1, "claim": "Presenta la reclamación a tu comercializadora si es sobre la tarifa, la factura o los datos del contrato, y a la distribuidora si es sobre cortes o averías.", "citations": [{"sourceId": "cnmc-energia"}]}, {"kind": "step", "n": 2, "claim": "La empresa tiene que acusar recibo con la fecha, la hora y el número de solicitud.", "citations": [{"sourceId": "cnmc-energia"}]}, {"kind": "step", "n": 3, "claim": "Si no contesta en plazo o no hay acuerdo, puedes acudir al sistema de resolución alternativa de litigios o al órgano competente de tu comunidad autónoma.", "citations": [{"sourceId": "cnmc-energia"}]}, {"kind": "warning", "claim": "Esta información puede estar desactualizada: la ficha de origen no tiene fecha de verificación.", "citations": [{"sourceId": "cnmc-energia"}]}]}
  - id: escalado-02
    category: escalado
    question: "Mi operadora de teléfono no me contesta a la reclamación, ¿a dónde voy?"
    expectedFicha: baja-linea-telefono
    expect:
      blocksWithCitations: true
      figuresBacked: true
      minSteps: 2
      stalenessWarning: true
      mustCiteSourceIds: [baja-linea-telefono]
    mockAnswer: |-
      {"question": "Mi operadora de teléfono no me contesta a la reclamación, ¿a dónde voy?", "outOfScope": false, "blocks": [{"kind": "step", "n": 1, "claim": "Reclama primero al operador: la ficha indica que la reclamación va primero a la empresa.", "citations": [{"sourceId": "baja-linea-telefono"}]}, {"kind": "step", "n": 2, "claim": "Si en un mes no contesta o la respuesta no te satisface, puedes acudir a la Oficina de Atención al Usuario de Telecomunicaciones.", "citations": [{"sourceId": "baja-linea-telefono"}]}, {"kind": "warning", "claim": "Esta información puede estar desactualizada: la ficha de origen no tiene fecha de verificación.", "citations": [{"sourceId": "baja-linea-telefono"}]}]}
  - id: escalado-03
    category: escalado
    question: "El banco no contesta a mi reclamación, ¿qué puedo hacer?"
    expectedFicha: banco-de-espana
    expect:
      blocksWithCitations: true
      figuresBacked: true
      minSteps: 2
      stalenessWarning: true
      mustCiteSourceIds: [banco-de-espana]
    mockAnswer: |-
      {"question": "El banco no contesta a mi reclamación, ¿qué puedo hacer?", "outOfScope": false, "blocks": [{"kind": "step", "n": 1, "claim": "El primer paso va a la entidad: un escrito ante su servicio de atención al cliente o su defensor del cliente.", "citations": [{"sourceId": "banco-de-espana"}]}, {"kind": "step", "n": 2, "claim": "Si no contesta en plazo o no estás de acuerdo con la respuesta, puedes acudir al servicio de reclamaciones del Banco de España.", "citations": [{"sourceId": "banco-de-espana"}]}, {"kind": "warning", "claim": "Esta información puede estar desactualizada: la ficha de origen no tiene fecha de verificación.", "citations": [{"sourceId": "banco-de-espana"}]}]}
  - id: escalado-04
    category: escalado
    question: "La portabilidad de mi número se ha retrasado, ¿dónde reclamo si el operador no responde?"
    expectedFicha: portabilidad-telefonia
    expect:
