name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagen oficial de Playwright: trae Node, navegadores y dependencias del sistema.
    # Evita `playwright install --with-deps` y su apt, que en runners Ubuntu se cuelga
    # de forma intermitente y bloquea la entrega. La etiqueta debe seguir la versión
    # de @playwright/test del lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El proveedor mock de la IA se activa en el webServer de la configuración.
      # Las fixtures sintéticas se regeneran aquí: no se versionan sus binarios.
      - run: pnpm --filter @letra-grande/web fixtures
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  review-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar el script del informe de review
        run: node --test scripts/check-review-report.test.mjs
      - name: Comprobar el informe de review
        run: node scripts/check-review-report.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
