name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Historia completa: la comprobación de entrega a main necesita ver si la
      # rama lleva los commits de main (docs/review-gate.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-decisions.test.mjs
      - name: Probar la comprobación de entrega a main
        run: node --test scripts/check-main-history.test.mjs
      # Solo aplica a PRs que van a main. Sin esto, un squash de dev a main
      # deja conflictos fantasma en la entrega siguiente.
      - name: Comprobar la historia de la entrega a main
        run: node scripts/check-main-history.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - run: pnpm check
      - run: pnpm build
      # La exportación estática del escritorio se construye también: si se rompe
      # una de las dos salidas, el PR falla (docs/desktop.md, sección 9).
      # Sin Playwright ni navegadores: solo next build en modo export.
      - run: pnpm build:desktop
      # La app de escritorio arranca en /hoy/: si la exportación deja de generar
      # ruta/index.html, ese arranque cae al respaldo y vuelve a la landing.
      - name: Comprobar la exportación de escritorio
        run: |
          test -f apps/web/dist-desktop/index.html
          test -f apps/web/dist-desktop/hoy/index.html

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagen oficial de Playwright: trae Node, navegadores y dependencias del sistema.
    # Evita `playwright install --with-deps` y su apt, que en runners Ubuntu se cuelga
    # de forma intermitente y bloquea la entrega. La etiqueta debe seguir la versión
    # de @playwright/test del lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Firefox necesita ipc compartido y un usuario sin privilegios: como root,
      # el sandbox de Firefox falla con EPERM al crear el espacio de nombres.
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El proveedor mock de la IA se activa en el webServer de la configuración.
      # Las fixtures sintéticas se regeneran aquí: no se versionan sus binarios.
      - run: pnpm --filter @letra-grande/web fixtures
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  review-report:
    runs-on: ubuntu-latest
    # Solo cuando el PR deja de ser borrador. Un PR se abre como borrador y se
    # marca listo cuando el informe de review ya está commiteado, de modo que el
    # ciclo de implementación no muestra un fallo que todavía no toca corregir.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      # Checkout del commit de la rama, no del merge ref: GitHub lo construye con
      # retraso, así que los runs de ready_for_review y edited podían ver un estado
      # anterior, sin el informe recién commiteado.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probar el script del informe de review
        run: node --test scripts/check-review-report.test.mjs
      - name: Comprobar el informe de review
        run: node scripts/check-review-report.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
