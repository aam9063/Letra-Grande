id: reclamar-retraso-vuelo
title: Reclamar por un vuelo retrasado, cancelado o por denegación de embarque
audience: consumidor
sector: transporte
summary: >-
  AESA recoge los derechos de las personas pasajeras y la reclamación se presenta desde su sede
  electrónica.
steps:
  - n: 1
    text: >-
      Presenta la reclamación en la sede electrónica de la Agencia Estatal de Seguridad Aérea.
    sourceId: aesa-derechos-pasajeros
documents: []
deadlines: []
warnings:
