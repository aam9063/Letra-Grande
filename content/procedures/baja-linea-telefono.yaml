    title: Telefonía e Internet | Usuarios Teleco
    url: https://usuariosteleco.digital.gob.es/reclamaciones/telefonia-e-internet
    kind: oficial
    retrievedOn: "2026-10-28"
verification:
  verified: false
  note: >-
    Borrador preparado por el agente con la fuente oficial consultada el 2026-10-28. Pendiente de
    verificación humana (H-07): el plazo de un mes es el que la fuente da para volver a reclamar;
    conviene confirmar si el contrato añade un preaviso distinto.
