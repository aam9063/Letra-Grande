id: baja-linea-telefono
title: Reclamar por la baja de una línea de teléfono
audience: consumidor
sector: telefonia
summary: >-
  Si la baja no se atiende, la reclamación va primero al operador. Si no contesta en un mes o la
  respuesta no satisface, la persona usuaria puede acudir a la Oficina de Atención al Usuario de
  Telecomunicaciones.
steps:
  - n: 1
    text: >-
      Reclama al operador por sus canales: teléfono, su web, correo postal o sus oficinas
      comerciales. El operador debe aceptar la presentación telefónica de la reclamación.
    sourceId: usuariosteleco-reclamaciones
  - n: 2
    text: >-
      Si en un mes no has recibido respuesta o la respuesta no te satisface, presenta la
      reclamación ante la Oficina de Atención al Usuario de Telecomunicaciones, por vía telemática
      con firma electrónica o en papel por correo postal o registro.
    sourceId: usuariosteleco-reclamaciones
documents: []
deadlines:
  - id: respuesta-operador
    label: Plazo para que el operador conteste antes de acudir a la Oficina
    kind: plazo_legal
    amount: 1
    unit: meses
    from: la presentación de la reclamación al operador
    sourceId: usuariosteleco-reclamaciones
warnings:
  - text: >-
      Las condiciones de la baja, como el preaviso o una permanencia, las fija el contrato con tu
      compañía: esta ficha no las afirma porque no se han consultado.
    sourceId: usuariosteleco-reclamaciones
  - text: >-
      El plazo para acudir a la Oficina después de la respuesta del operador no se afirma aquí:
      queda para la verificación humana con la fuente delante.
    sourceId: usuariosteleco-reclamaciones
legalBasis: []
sources:
  - id: usuariosteleco-reclamaciones
    title: Telefonía e Internet | Usuarios Teleco
    url: https://usuariosteleco.digital.gob.es/reclamaciones/telefonia-e-internet
    kind: oficial
    retrievedOn: "2026-10-28"
verification:
  verified: false
  note: >-
    Borrador preparado por el agente con la fuente oficial consultada el 2026-10-28. Pendiente de
    verificación humana (H-07): preaviso contractual, plazo para acudir a la Oficina y canales
    concretos de la baja en cada compañía.
