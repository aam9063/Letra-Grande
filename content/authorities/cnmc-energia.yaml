howToFile: >-
  La reclamación va primero a la empresa: a la comercializadora si es sobre la tarifa, altas y
  bajas de compañía, la factura o los datos del contrato, y a la distribuidora si es sobre
  cortes o averías, el contador, las lecturas o un fraude. La empresa debe emitir un acuse de
  recibo con fecha, hora y número de solicitud y contestar en un máximo de quince días hábiles
  (cinco para reclamaciones al distribuidor de usuarios con menos de 15 kW sobre medida,
  facturación o cortes indebidos). Si no contesta o no hay acuerdo, la persona consumidora
  puede acudir al sistema de resolución alternativa de litigios o al órgano competente de su
  comunidad autónoma. La CNMC no resuelve reclamaciones: supervisa que se cumplan las medidas
  de protección.
