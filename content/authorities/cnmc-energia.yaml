url: https://www.cnmc.es/facil-para-ti/que-hace-la-cnmc-para-consumidores/comercializacion-y-suministro-electrico
howToFile: >-
  La reclamación se dirige primero a la empresa: a la comercializadora para cambios o dudas
  sobre la tarifa, altas y bajas de compañía o gestión del contrato, y a la distribuidora para
  lo que afecta a la red. Las reclamaciones ante la distribuidora se pueden presentar también
  a través de la comercializadora. La CNMC publica una guía de cómo presentar una reclamación
  y, si el conflicto no se resuelve, la persona consumidora puede acudir al organismo de
  consumo que le corresponda.
