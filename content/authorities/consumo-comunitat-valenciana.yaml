id: consumo-comunitat-valenciana
name: Dirección General de Comercio, Artesanía y Consumo (Comunitat Valenciana)
scope: autonomico
region: Comunitat Valenciana
sectors: [energia, telefonia, banca, seguros, transporte, suscripciones, vivienda, otros]
url: https://cindi.gva.es/es/web/consumo/presentacion-de-reclamaciones-y-quejas
howToFile: >-
  Primero hay que dirigirse al servicio de atención al cliente de la empresa o profesional. Si
  no hay acuerdo, la reclamación o queja se puede presentar en los servicios territoriales de
  Comercio y Consumo de la conselleria, en la oficina municipal de información al consumidor
  del municipio (OMIC), en las asociaciones de personas consumidoras, o de forma telemática
  con certificado digital. La empresa debe disponer de hojas de reclamaciones oficiales; si no
  las tiene, se puede presentar un escrito con los datos y la descripción de los hechos.
