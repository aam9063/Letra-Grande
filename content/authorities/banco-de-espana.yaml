url: https://www.bde.es/wbe/es/punto-informacion/contenidos/gestiones/reclamaciones/
howToFile: >-
  El primer paso es obligatorio y va a la entidad: un escrito ante el servicio de atención al
  cliente o el defensor del cliente de la entidad. La ficha indica que la entidad tiene 15
  días hábiles para contestar si la reclamación está relacionada con un servicio de pago, un
  mes para otras reclamaciones si eres consumidor y dos meses si no lo eres. Si no contestan
  en plazo o no estás de acuerdo con la respuesta, se puede acudir al servicio de reclamaciones
  del Banco de España, también por su sede electrónica.
