howToFile: >-
  La página de derechos de los pasajeros de AESA recoge cómo reclamar por cancelación, retraso
  o denegación de embarque, y desde ella se inicia la reclamación con la Agencia. La ficha no
  detalla plazos ni documentación: eso queda para la verificación humana y para la ficha de
  trámite correspondiente.
