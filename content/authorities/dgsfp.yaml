id: dgsfp
name: Dirección General de Seguros y Fondos de Pensiones (Servicio de Reclamaciones)
scope: estatal
sectors: [seguros]
url: https://dgsfp.mineco.gob.es/es/Consumidor/Reclamaciones/Paginas/InformacionProcedimiento.aspx
howToFile: >-
  El Servicio de Reclamaciones atiende consultas, quejas y reclamaciones de la ciudadanía por
  el procedimiento que regula la Orden ECC/2502/2012, la misma norma que ordena los servicios
  de reclamaciones del Banco de España y de la Comisión Nacional del Mercado de Valores. Su
  web publica la información del procedimiento y la guía GASPAR para la persona asegurada y
  partícipe, con el proceso de reclamación explicado paso a paso.
