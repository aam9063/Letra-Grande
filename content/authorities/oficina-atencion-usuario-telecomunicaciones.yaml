id: oficina-atencion-usuario-telecomunicaciones
name: Oficina de Atención al Usuario de Telecomunicaciones
scope: estatal
sectors: [telefonia]
url: https://usuariosteleco.digital.gob.es/reclamaciones/telefonia-e-internet
howToFile: >-
  Primero hay que reclamar al operador, que debe aceptar la presentación por teléfono, además
  de por internet, correo postal o en sus oficinas comerciales. Si no se resuelve, se presenta
  la reclamación ante la Oficina: por vía telemática con firma electrónica desde su web, o en
  papel por correo postal o en los registros habilitados. La Oficina no da información sobre
  reclamaciones en las dependencias de la Secretaría de Estado.
