# Empaquetado de la aplicacion de escritorio de Letra Grande (DESK-03).
# Sin secretos: el binario no lleva ninguna clave, solo la URL publica del
# proxy del asistente. La firma de codigo queda fuera de esta tarea.
appId: es.letragrande.app
productName: Letra Grande
directories:
  output: release
# Solo el proceso principal compilado y el manifiesto. El renderer va en
# extraResources, fuera del asar, para no duplicarlo.
files:
  - dist/**
  - "!dist/*.test.js"
  - package.json
# El renderer estatico (apps/web/dist-desktop) viaja en resources/renderer.
extraResources:
  - from: ../web/dist-desktop
    to: renderer
win:
  # PNG de 512x512 en build/: electron-builder lo convierte al .ico del exe y del
  # instalador. Sin esta linea el binario sale con el icono de Electron.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
# Canal de actualizaciones (DESK-03b, decision D-12): GitHub Releases. Es el
# unico proveedor: sin telemetria y sin servidores de actualizacion de
# terceros. La publicacion genera un borrador que una persona revisa antes de
# publicarlo. Con esta configuracion electron-builder genera app-update.yml en
# resources/, que es lo que lee electron-updater en la app instalada.
publish:
  provider: github
  owner: aam9063
  repo: Letra-Grande
  releaseType: draft
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
